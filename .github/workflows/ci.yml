name: CI

on:
  push:
    # claude/** too, so work on those branches is checked before it is
    # proposed for main.
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  # Build and test the Rust crate
  build:
    name: Build & Test (Rust)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Stable, and the minimum supported version: Cargo.toml's
        # rust-version, which Wasmtime 49 sets at 1.96 (docs/adr/0010).
        rust: [stable, "1.96"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      # Formatting and lints change between toolchains, so they are checked
      # on stable only. The minimum version has to build and pass the tests.
      - name: Check formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: Run clippy lints
        if: matrix.rust == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Features outside the trusted core are off by default (docs/adr/0006).
      # `full` is everything except the Python bindings, so no test is skipped.
      - name: Build
        run: cargo build --all-targets --features full

      - name: Run unit tests
        run: cargo test --lib --features full --verbose

      - name: Run doc tests
        run: cargo test --doc --features full --verbose

      - name: Run integration tests
        run: cargo test --test '*' --features full --verbose

      # Cedar policy proofs (docs/adr/0009) need the cvc5 1.3.1 solver,
      # pinned by checksum.
      - name: Install cvc5 1.3.1
        run: |
          curl -sSL -o /tmp/cvc5.zip \
            https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/cvc5-Linux-x86_64-static.zip
          echo "1a1cda20d2df4938fa4944a69f33ddc9172e319ece0eed0aa09c4d7abede3ed1  /tmp/cvc5.zip" \
            | sha256sum -c -
          unzip -q /tmp/cvc5.zip -d /tmp/cvc5
          echo "CVC5=/tmp/cvc5/cvc5-Linux-x86_64-static/bin/cvc5" >> "$GITHUB_ENV"

      # Tests that need the solver are #[ignore]d without it; run them here.
      # Then prove the shipped policies' properties, as a user's CI would.
      - name: Prove Cedar policy properties
        run: |
          cargo test --features full --test cedar_properties -- --include-ignored
          cargo run --example cedar_check --features cedar-analysis -- \
            --policies policies/cedar --properties policies/cedar/properties
          cargo run --example cedar_check --features cedar-analysis -- \
            --schema policies/cedar/examples/payments.cedarschema \
            --policies policies/cedar/examples/payments.cedar \
            --properties policies/cedar/examples/payments.properties.cedar

      # Does this change let the default policies allow anything they didn't?
      # Widening can be intended, so this reports rather than blocks: a
      # reviewer reads the counterexample.
      - name: Check Cedar policies don't widen access
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add /tmp/base FETCH_HEAD
          if [ -d /tmp/base/policies/cedar ]; then
            cargo run --example cedar_check --features cedar-analysis -- \
              --policies policies/cedar --baseline /tmp/base/policies/cedar
          fi

      # The trusted core must build and pass its tests with nothing else.
      - name: Build and test the core alone
        run: |
          cargo build --no-default-features
          cargo test --no-default-features --verbose

  # WASM skill builds
  wasm-skills:
    name: Build WASM Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.toml') }}

      - name: Build calculator skill
        run: cargo build -p calculator --target wasm32-unknown-unknown --release

      - name: Build crypto-hasher skill
        run: cargo build -p crypto-hasher --target wasm32-unknown-unknown --release

      - name: Build json-validator skill
        run: cargo build -p json-validator --target wasm32-unknown-unknown --release

      - name: Build text-analyzer skill
        run: cargo build -p text-analyzer --target wasm32-unknown-unknown --release

      - name: Build regex-matcher skill
        run: cargo build -p regex-matcher --target wasm32-unknown-unknown --release

  # Code coverage with cargo-tarpaulin
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.toml') }}

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage
        run: cargo tarpaulin --config tarpaulin.toml --out Xml --out Html --output-dir coverage/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Enforce coverage threshold (80%)
        run: cargo tarpaulin --config tarpaulin.toml --fail-under 80

  # Python SDK tests
  python-tests:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./python[dev]" || pip install pytest pytest-asyncio
          pip install -r requirements.txt || true

      - name: Run Python tests
        run: python -m pytest python/tests/ -v --tb=short

      # The native module, once: the bindings' Rust tests, then the SDK's
      # native tests against the built module (docs/adr/0011).
      - name: Install Rust toolchain
        if: matrix.python-version == '3.12'
        uses: dtolnay/rust-toolchain@stable

      - name: Test the native bindings (Rust)
        if: matrix.python-version == '3.12'
        run: cargo test --features python --lib "python::"

      - name: Test the native module (Python)
        if: matrix.python-version == '3.12'
        env:
          VAK_REQUIRE_NATIVE: "1"
        run: |
          python -m venv .venv-native
          . .venv-native/bin/activate
          pip install maturin pytest
          maturin develop
          python -m pytest python/tests/test_native_kernel.py -v --tb=short

  # Benchmarks (non-blocking, for tracking performance)
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.toml') }}

      - name: Run benchmarks
        run: cargo bench --bench kernel_benchmarks -- --output-format bencher | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 90

  # Property-based tests (extended)
  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-proptest-${{ hashFiles('**/Cargo.toml') }}

      - name: Run property tests with extended cases
        env:
          PROPTEST_CASES: 512
        run: cargo test --test property_tests --features full --verbose
